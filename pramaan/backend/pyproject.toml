[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan"
version = "0.1.0"
description = "Pramaan (VeriCampus): Multi-tier neuro-symbolic verification, cross-document claim graph, and DPDP Merkle passport governance platform."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.4",
    "z3-solver>=4.13.0",
    "rapidfuzz>=3.10.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.1.0",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "cryptography>=43.0.0",
    "cbor2>=5.6.5",
    "qrcode>=8.0",
    "pytesseract>=0.3.13",
    "rapidocr-onnxruntime>=1.3.25",
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "import-linter>=2.1",
]

[project.scripts]
pramaan = "pramaan.cli:main"
pramaan-mcp = "pramaan.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pramaan = ["engine/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "pramaan"

[[tool.importlinter.contracts]]
name = "Hexagonal Pramaan Layer Stack"
type = "layers"
layers = [
    "pramaan.api",
    "pramaan.store",
    "pramaan.mcp",
    "pramaan.ledger",
    "pramaan.canon",
    "pramaan.parsers",
    "pramaan.checks",
    "pramaan.engine",
    "pramaan.erp",
    "pramaan.domain",
]

[[tool.importlinter.contracts]]
name = "Checks must not depend on parsers"
type = "forbidden"
source_modules = [
    "pramaan.checks",
]
forbidden_modules = [
    "pramaan.parsers",
]
